<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>HOOT - 策略</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .strategy-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .strategy-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .strategy-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .strategy-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .strategy-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .strategy-info {
      padding: 12px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .strategy-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .type-filter-tabs {
      display: flex;
      gap: 6px;
      padding: 0 20px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .type-filter-tabs::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div class="mobile-container">
    <!-- 顶部 Logo 栏 -->
    <div class="top-bar">
      <div class="logo">H</div>
      <div class="brand">HOOT</div>
    </div>

    <!-- 页面标题 + 新建按钮 -->
    <div class="page-header">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <div class="page-title">策略</div>
          <div class="page-subtitle">管理你的交易策略</div>
        </div>
        <a class="btn btn-primary btn-sm" href="strategy-edit.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          创建
        </a>
      </div>
    </div>

    <!-- 类型筛选 -->
    <div class="type-filter-tabs">
      <button class="top-tab active">全部 · 3</button>
      <button class="top-tab">AI 智能</button>
      <button class="top-tab">网格</button>
      <button class="top-tab">Arena</button>
    </div>

    <!-- 策略卡片列表 -->
    <div class="section">
      <!-- AI 智能策略 -->
      <div class="strategy-card">
        <div class="strategy-header">
          <div>
            <div class="strategy-title-row">
              <span class="strategy-name">ai 交易</span>
            </div>
            <div class="strategy-badges">
              <span class="badge badge-primary">AI 智能</span>
              <span class="badge badge-success"><span class="dot"></span>激活中</span>
            </div>
          </div>
          <button style="background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 4px;">⋯</button>
        </div>

        <div class="strategy-info">
          <div class="data-row">
            <span class="label">币种</span>
            <span class="value">BTC / ETH / SOL</span>
          </div>
          <div class="data-row">
            <span class="label">杠杆</span>
            <span class="value">5x</span>
          </div>
          <div class="data-row">
            <span class="label">最大持仓</span>
            <span class="value">3</span>
          </div>
          <div class="data-row">
            <span class="label">使用中</span>
            <span class="value">1 个交易员</span>
          </div>
        </div>

        <div class="strategy-actions">
          <a class="btn btn-secondary btn-sm" href="strategy-edit.html">编辑</a>
          <a class="btn btn-secondary btn-sm" href="strategy-prompt.html">Prompt</a>
          <a class="btn btn-secondary btn-sm" href="strategy-test.html">测试</a>
        </div>
      </div>

      <!-- 网格策略 -->
      <div class="strategy-card">
        <div class="strategy-header">
          <div>
            <div class="strategy-title-row">
              <span class="strategy-name"><a href="strategy-edit.html" style="color: inherit; text-decoration: none;">网格 SOL</a></span>
            </div>
            <div class="strategy-badges">
              <span class="badge" style="color: #22C55E; background: rgba(34, 197, 94, 0.12);">网格</span>
              <span class="badge badge-muted">已停用</span>
            </div>
          </div>
          <button style="background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 4px;">⋯</button>
        </div>

        <div class="strategy-info">
          <div class="data-row">
            <span class="label">币种</span>
            <span class="value">SOLUSDT</span>
          </div>
          <div class="data-row">
            <span class="label">网格层数</span>
            <span class="value">20</span>
          </div>
          <div class="data-row">
            <span class="label">总投入</span>
            <span class="value tabular">$1,000</span>
          </div>
          <div class="data-row">
            <span class="label">使用中</span>
            <span class="value">0 个交易员</span>
          </div>
        </div>

        <div class="strategy-actions">
          <a class="btn btn-secondary btn-sm" href="strategy-edit.html">编辑</a>
          <a class="btn btn-secondary btn-sm" href="strategy-prompt.html">Prompt</a>
          <a class="btn btn-secondary btn-sm" href="strategy-test.html">测试</a>
        </div>
      </div>

      <!-- Arena 策略 -->
      <div class="strategy-card">
        <div class="strategy-header">
          <div>
            <div class="strategy-title-row">
              <span class="strategy-name">Arena 测试</span>
            </div>
            <div class="strategy-badges">
              <span class="badge" style="color: #C084FC; background: rgba(192, 132, 252, 0.12);">Arena 竞技</span>
              <span class="badge badge-success"><span class="dot"></span>激活中</span>
            </div>
          </div>
          <button style="background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 4px;">⋯</button>
        </div>

        <div class="strategy-info">
          <div class="data-row">
            <span class="label">币种</span>
            <span class="value">BTCUSDT</span>
          </div>
          <div class="data-row">
            <span class="label">分析师</span>
            <span class="value">4 个 · 全开</span>
          </div>
          <div class="data-row">
            <span class="label">辩论轮数</span>
            <span class="value">1 + 1</span>
          </div>
          <div class="data-row">
            <span class="label">风险偏好</span>
            <span class="value">平衡</span>
          </div>
          <div class="data-row">
            <span class="label">使用中</span>
            <span class="value">1 个交易员</span>
          </div>
        </div>

        <div class="strategy-actions">
          <a class="btn btn-secondary btn-sm" href="strategy-edit.html">编辑</a>
          <a class="btn btn-secondary btn-sm" href="strategy-prompt.html">Prompt</a>
          <a class="btn btn-secondary btn-sm" href="strategy-test.html">测试</a>
        </div>
      </div>
    </div>

    <!-- 底部 Tab Bar -->
    <nav class="tab-bar">
      <a href="config.html" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="tab-label">配置</span>
      </a>
      <a href="dashboard.html" class="tab-item">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9"/>
          <rect x="14" y="3" width="7" height="5"/>
          <rect x="14" y="12" width="7" height="9"/>
          <rect x="3" y="16" width="7" height="5"/>
        </svg>
        <span class="tab-label">看板</span>
      </a>
      <a href="strategy.html" class="tab-item active">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
        <span class="tab-label">策略</span>
      </a>
    </nav>
  </div>
</body>
</html>
