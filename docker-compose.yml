services:
  # === 数据库 ===
  postgres:
    image: postgres:16
    container_name: quantfi-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: quantfi
      POSTGRES_PASSWORD: quantfi123
      POSTGRES_DB: quantfi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantfi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === 缓存/消息队列 ===
  redis:
    image: redis:7-alpine
    container_name: quantfi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 注意：Freqtrade 使用源码方式运行，不在 Docker 中
  # 启动命令：cd freqtrade && freqtrade trade --config user_data/config.json --strategy SampleStrategy

volumes:
  postgres_data:
  redis_data:
