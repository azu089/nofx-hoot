# HOOT 生产环境 Docker Compose 配置
# 使用方式：docker compose -f docker-compose.prod.yml up -d

services:
  # === API 服务 (NestJS) ===
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hoot-api
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=postgresql://hoot:${DB_PASSWORD}@postgres:5432/hoot
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      # 链上监听配置（可选）
      - ENABLE_BLOCKCHAIN_LISTENER=${ENABLE_BLOCKCHAIN_LISTENER:-false}
      - BSC_RPC_URL=${BSC_RPC_URL:-https://bsc-dataseed1.binance.org}
      - USDT_CONTRACT_ADDRESS=${USDT_CONTRACT_ADDRESS:-0x55d398326f99059fF775485246999027B3197955}
      - HOOT_CONTRACT_ADDRESS=${HOOT_CONTRACT_ADDRESS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/api/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Web 服务 (Next.js) ===
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: hoot-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://api:4001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === 数据库 ===
  postgres:
    image: postgres:16-alpine
    container_name: hoot-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=hoot
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=hoot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoot -d hoot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoot-network

  # === 缓存/消息队列 ===
  redis:
    image: redis:7-alpine
    container_name: hoot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoot-network

  # === Nginx 反向代理（可选） ===
  nginx:
    image: nginx:alpine
    container_name: hoot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - hoot-network
    profiles:
      - with-nginx

networks:
  hoot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
