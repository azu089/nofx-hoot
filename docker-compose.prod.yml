# ==============================================
# HOOT 生产环境 Docker Compose 配置
# 域名: hoot.cool
# ==============================================
# 使用方式：
#   1. 复制 .env.production.example 为 .env
#   2. 填入所有必要的环境变量
#   3. docker compose -f docker-compose.prod.yml up -d
#
# 启用 Nginx: docker compose -f docker-compose.prod.yml --profile with-nginx up -d
# ==============================================

services:
  # === API 服务 (NestJS) ===
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hoot-api
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - API_PORT=4001
      - DATABASE_URL=postgresql://hoot:${DB_PASSWORD}@postgres:5432/hoot
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 安全密钥
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      # 邮件服务
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=noreply@hoot.cool
      # 链上配置
      - BSC_RPC_URL=${BSC_RPC_URL:-https://bsc-dataseed1.binance.org}
      - USDT_CONTRACT_ADDRESS=${USDT_CONTRACT_ADDRESS:-0x55d398326f99059fF775485246999027B3197955}
      - WITHDRAW_WALLET_PRIVATE_KEY=${WITHDRAW_WALLET_PRIVATE_KEY:-}
      - DEPOSIT_WALLET_ADDRESS=${DEPOSIT_WALLET_ADDRESS:-}
      # Freqtrade
      - FREQTRADE_API_URL=${FREQTRADE_API_URL:-}
      - FREQTRADE_JWT_SECRET=${FREQTRADE_JWT_SECRET:-}
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TG_BOT_API_URL=${TG_BOT_API_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4001/api/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Web 服务 (Next.js) ===
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: hoot-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 生产环境使用 HTTPS 域名
      - NEXT_PUBLIC_API_URL=https://api.hoot.cool
      - NEXT_PUBLIC_SITE_URL=https://hoot.cool
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === 数据库 ===
  postgres:
    image: postgres:16-alpine
    container_name: hoot-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=hoot
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=hoot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoot -d hoot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoot-network

  # === 缓存/消息队列 ===
  redis:
    image: redis:7-alpine
    container_name: hoot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoot-network

  # === Telegram Bot 服务 ===
  telegram-bot:
    build:
      context: ./apps/telegram-bot
      dockerfile: Dockerfile
    container_name: hoot-telegram-bot
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_URL=http://api:4001
      - API_INTERNAL_SECRET=${WEBHOOK_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Nginx 反向代理（可选） ===
  nginx:
    image: nginx:alpine
    container_name: hoot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - hoot-network
    profiles:
      - with-nginx

networks:
  hoot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
