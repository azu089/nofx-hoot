# ==============================================
# HOOT 生产环境 Docker Compose 配置
# 域名: hoot.cool
# ==============================================
# 使用方式：
#   1. 复制 .env.example 为 .env 并填入所有必要的环境变量
#   2. docker compose -f docker-compose.prod.yml up -d
#
# 启用 Nginx: docker compose -f docker-compose.prod.yml --profile with-nginx up -d
# 启用 Freqtrade: docker compose -f docker-compose.prod.yml --profile with-freqtrade up -d
# 全部启用: docker compose -f docker-compose.prod.yml --profile with-nginx --profile with-freqtrade up -d
# ==============================================

services:
  # === API 服务 (NestJS) ===
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hoot-api
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - API_PORT=4001
      - DATABASE_URL=postgresql://hoot:${DB_PASSWORD}@postgres:5432/hoot
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # 安全密钥
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      # 邮件服务
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=noreply@hoot.cool
      # 链上配置
      - BSC_RPC_URL=${BSC_RPC_URL:-https://bsc-dataseed1.binance.org}
      - USDT_CONTRACT_ADDRESS=${USDT_CONTRACT_ADDRESS:-0x55d398326f99059fF775485246999027B3197955}
      - HOOT_CONTRACT_ADDRESS=${HOOT_CONTRACT_ADDRESS:-}
      - ENABLE_BLOCKCHAIN_LISTENER=${ENABLE_BLOCKCHAIN_LISTENER:-false}
      # HD 钱包 + 热钱包
      - HD_WALLET_MNEMONIC=${HD_WALLET_MNEMONIC}
      - WITHDRAW_WALLET_PRIVATE_KEY=${WITHDRAW_WALLET_PRIVATE_KEY:-}
      - HOT_WALLET_ADDRESS=${HOT_WALLET_ADDRESS:-}
      # 提现风控
      - WITHDRAW_AUTO_THRESHOLD=${WITHDRAW_AUTO_THRESHOLD:-500}
      - WITHDRAW_DAILY_AUTO_LIMIT=${WITHDRAW_DAILY_AUTO_LIMIT:-5000}
      - WITHDRAW_USER_DAILY_LIMIT=${WITHDRAW_USER_DAILY_LIMIT:-3}
      # Freqtrade
      - FREQTRADE_API_URL=${FREQTRADE_API_URL:-}
      - FREQTRADE_JWT_SECRET=${FREQTRADE_JWT_SECRET:-}
      # Freqtrade 健康监控（多实例格式: name:url,name:url）
      - FREQTRADE_INSTANCES=${FREQTRADE_INSTANCES:-HootTestStrategy:http://freqtrade-test:8090,HootOwlV1:http://freqtrade-owl:8091}
      - FREQTRADE_USERNAME=${FT_API_USERNAME:-hoot}
      - FREQTRADE_PASSWORD=${FT_API_PASSWORD:-}
      # Telegram（用户 Bot + 管理员 Bot）
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_URL=http://telegram-bot:4002
      - TELEGRAM_BOT_API_SECRET=${TELEGRAM_BOT_API_SECRET:-}
      - ADMIN_BOT_URL=http://admin-bot:4003
      # Sentry 错误追踪
      - SENTRY_DSN=${SENTRY_DSN:-}
      # AI 模型 Key
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # 数据源 Key
      - CRYPTOCOMPARE_API_KEY=${CRYPTOCOMPARE_API_KEY:-}
      - CRYPTOPANIC_API_KEY=${CRYPTOPANIC_API_KEY:-}
      - COINGLASS_API_KEY=${COINGLASS_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - NASDAQ_DATA_LINK_API_KEY=${NASDAQ_DATA_LINK_API_KEY:-}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4001/api/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Web 服务 (Next.js) ===
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://api.hoot.cool/api
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
        - NEXT_PUBLIC_TG_BOT_USERNAME=HootCool_bot
    container_name: hoot-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=https://api.hoot.cool/api
      - NEXT_PUBLIC_SITE_URL=https://hoot.cool
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === 管理后台 (Vite + React SPA) ===
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.hoot.cool
    container_name: hoot-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === 数据库 ===
  postgres:
    image: postgres:16-alpine
    container_name: hoot-postgres
    restart: unless-stopped
    # 生产环境不暴露端口，仅通过 Docker 内部网络访问
    # 调试时取消注释: ports: ["127.0.0.1:5433:5432"]
    environment:
      - POSTGRES_USER=hoot
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=hoot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoot -d hoot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoot-network

  # === 缓存/消息队列 ===
  redis:
    image: redis:7-alpine
    container_name: hoot-redis
    restart: unless-stopped
    # 生产环境不暴露端口，仅通过 Docker 内部网络访问
    # 调试时取消注释: ports: ["127.0.0.1:6379:6379"]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hoot-network

  # === Telegram 用户 Bot ===
  telegram-bot:
    build:
      context: ./apps/telegram-bot
      dockerfile: Dockerfile
    container_name: hoot-telegram-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_BASE_URL=http://api:4001/api
      - TELEGRAM_BOT_API_SECRET=${TELEGRAM_BOT_API_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Telegram 管理员 Bot（独立于用户 Bot） ===
  admin-bot:
    build:
      context: ./apps/admin-bot
      dockerfile: Dockerfile
    container_name: hoot-admin-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:4003:4003"
    environment:
      - NODE_ENV=production
      - ADMIN_BOT_HTTP_PORT=4003
      - ADMIN_TELEGRAM_BOT_TOKEN=${ADMIN_TELEGRAM_BOT_TOKEN}
      - ADMIN_TG_IDS=${ADMIN_TG_IDS}
      - API_BASE_URL=http://api:4001/api
      - TELEGRAM_BOT_API_SECRET=${TELEGRAM_BOT_API_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hoot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Freqtrade HootTest 策略 ===
  freqtrade-test:
    image: freqtradeorg/freqtrade:2024.11-py3.12
    container_name: hoot-freqtrade-test
    restart: unless-stopped
    volumes:
      - ./training/user_data:/freqtrade/user_data
      - ./training/config-hoot-test.json:/freqtrade/config.json
    command: trade --config /freqtrade/config.json --strategy HootTestStrategy
    environment:
      # 通过环境变量覆盖 API Server 凭证（避免硬编码）
      - FREQTRADE__API_SERVER__USERNAME=${FT_API_USERNAME:-hoot}
      - FREQTRADE__API_SERVER__PASSWORD=${FT_API_PASSWORD}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FT_JWT_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hoot-network
    profiles:
      - with-freqtrade
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Freqtrade HootOwl 策略 ===
  freqtrade-owl:
    image: freqtradeorg/freqtrade:2024.11-py3.12
    container_name: hoot-freqtrade-owl
    restart: unless-stopped
    volumes:
      - ./training/user_data:/freqtrade/user_data
      - ./training/config-hoot-owl.json:/freqtrade/config.json
    command: trade --config /freqtrade/config.json --strategy HootOwlV1
    environment:
      - FREQTRADE__API_SERVER__USERNAME=${FT_API_USERNAME:-hoot}
      - FREQTRADE__API_SERVER__PASSWORD=${FT_API_PASSWORD}
      - FREQTRADE__API_SERVER__JWT_SECRET_KEY=${FT_JWT_SECRET_OWL}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - hoot-network
    profiles:
      - with-freqtrade
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # === Nginx 反向代理 ===
  nginx:
    image: nginx:1.27-alpine
    container_name: hoot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - admin
    networks:
      - hoot-network
    profiles:
      - with-nginx

networks:
  hoot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
